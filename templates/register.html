<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Register - ADCoiffure</title>
    
</head>
<body>
    <!-- Section to display flash messages -->
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="register-container">
        <h2>Create an Account</h2>
        <form action="/register" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        
            <label for="phone">Phone:</label>
            <div class="phone-prefix-container">
                <!-- Image du drapeau des USA -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Flag_of_the_United_States.svg/20px-Flag_of_the_United_States.svg.png" alt="US Flag">
                <!-- Préfixe +1 -->
                <span>+1</span>
                <!-- Champ de saisie pour le numéro de téléphone -->
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="123-456-7890" 
                    
                    required 
                    class="phone-input"
                >
            </div>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
        
            <button type="submit">Register</button>
        </form>
        
        <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            const phoneInput = document.getElementById('phone');
            if (!phoneInput.value.startsWith('+1')) {
                phoneInput.value = '+1 ' + phoneInput.value;
            }
        });
        </script>
        <p>Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>

        <a href="{{ url_for('index') }}"  class="btn">Return to Homepage</a>
    </div>
</body>
</html>

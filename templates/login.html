<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Login - ADCoiffure</title>
    
</head>
<body>
    <!-- Section to display flash messages -->
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    
    <div class="login-container">
        <h2>Log In</h2>
        <form action="/login" method="POST">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <label class="remember-me-label">
                <input type="checkbox" name="remember_me" class="remember-me-checkbox"> Remember Me
            </label>

            <button type="submit">Log In</button>
        </form>
        <p>Not registered yet? <a href="{{ url_for('register') }}">Create an account</a>.</p>
        <a href="{{ url_for('forgot_password') }}">Forgot password ?</a><br>

        <a href="{{ url_for('index') }}"  class="btn">Return to Homepage</a>

    </div>
</body>
</html>
